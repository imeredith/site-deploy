<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{if .Failed}}{{.Host}} couldn't start{{else}}Starting {{.Host}}…{{end}}</title>
{{if not .Failed}}<noscript><meta http-equiv="refresh" content="3"></noscript>{{end}}
<style>
:root { color-scheme: light dark; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #f7f7f8; color: #1d1d1f; }
@media (prefers-color-scheme: dark) { body { background: #141416; color: #ececf0; } }
main { box-sizing: border-box; max-width: 30rem; padding: 2rem; text-align: center; overflow-wrap: anywhere; }
.spinner { width: 40px; height: 40px; margin: 0 auto 24px; box-sizing: border-box; border: 3px solid rgba(128, 128, 128, .25); border-top-color: currentColor; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
p { margin: 0; opacity: .7; }
button { margin-top: 24px; padding: 8px 20px; font: inherit; color: inherit; background: transparent; border: 1px solid rgba(128, 128, 128, .4); border-radius: 8px; cursor: pointer; }
button:hover { background: rgba(128, 128, 128, .12); }
.failed .when-starting, main:not(.failed) .when-failed { display: none; }
</style>
</head>
<body>
<main role="status" aria-live="polite"{{if .Failed}} class="failed"{{end}}>
<div class="spinner when-starting" aria-hidden="true"></div>
<h1 class="when-starting">Starting up</h1>
<p class="when-starting">{{.Host}} was asleep.<br>This page will load as soon as it's ready.</p>
<h1 class="when-failed">This site couldn't start</h1>
<p class="when-failed">{{.Host}} failed to wake up.<br>Try again in a moment.</p>
<button class="when-failed" type="button" onclick="location.reload()">Try again</button>
</main>
{{if not .Failed}}<script>
// Each check waits up to ten seconds on the server and answers as soon as the
// site is ready. Anything unexpected, such as the site being removed, reloads
// the page after a pause so the visitor sees the real response.
(async () => {
  for (;;) {
    let state;
    try {
      const response = await fetch(location.href, { headers: { "X-Site-Deploy-Resume": "1" }, cache: "no-store" });
      state = (await response.json()).state;
    } catch {}
    if (state === "starting") continue;
    if (state === "failed") {
      document.querySelector("main").className = "failed";
      document.title = {{.Host}} + " couldn't start";
      return;
    }
    if (state !== "running") await new Promise((resolve) => setTimeout(resolve, 2000));
    location.reload();
    return;
  }
})();
</script>{{end}}
</body>
</html>
